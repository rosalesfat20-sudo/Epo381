# =====================================================================
# EPO 381 — VirtualHost AJUSTADO a tu configuración real
# (la que ya tienes en Apache; solo se le agregó lo necesario para que
# el sistema funcione: AllowOverride para que la seguridad de /uploads
# funcione, y el bloque <Directory> con permisos).
#
# Tu configuración original comparte el subdominio mguadarrama.stackteam.online
# con otros proyectos (/productos y /personas van a otras apps por proxy).
# EPO 381 vive en la raíz de ese mismo subdominio, en tu DocumentRoot
# /var/www/mguadarrama/Epo381 — eso ya estaba bien, no lo toqué.
# =====================================================================

<VirtualHost *:80>
    ServerName  mguadarrama.stackteam.online
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =mguadarrama.stackteam.online
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    ServerName mguadarrama.stackteam.online
    DocumentRoot /var/www/mguadarrama/Epo381
    CustomLog  /var/log/apache2/mguadarrama.stackteam.online.log combined
    Options -Indexes

    # ── ESTO ES LO NUEVO QUE HACÍA FALTA ──
    # Sin esto, el archivo uploads/.htaccess del proyecto (que bloquea que se
    # pueda ejecutar código PHP subido dentro de la carpeta de imágenes de
    # avisos) queda ignorado por Apache. Con esto, se activa esa protección.
    <Directory /var/www/mguadarrama/Epo381>
        AllowOverride All
        Require all granted
    </Directory>

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/stackteam.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stackteam.online/privkey.pem

    ProxyPreserveHost On
    ProxyPass /productos http://localhost:3017/productos
    ProxyPassReverse /productos http://localhost:3017/productos
    ProxyPass /personas http://localhost:3018/personas
    ProxyPassReverse /personas http://localhost:3018/personas
</VirtualHost>
